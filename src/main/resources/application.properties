spring.application.name=McpServerApplication
spring.main.web-application-type = none
spring.ai.mcp.server.version = 0.0.1

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true

spring.main.banner.mode=off

# Todo el sistema se consume a traves del API Gateway (un prefijo por modulo).
GATEWAY_URL=https://apigateway-cs0b.onrender.com
DONACIONES_API_URL=${GATEWAY_URL}/api/donaciones
LOGISTICA_API_URL=${GATEWAY_URL}/api/logistica
INCENTIVOS_API_URL=${GATEWAY_URL}/api/incentivos
DONADORES_ENTIDADES_API_URL=${GATEWAY_URL}/api/donadores
# Servicio de Consultas (modelo de lectura): el primer "consultas" es el prefijo del gateway y el segundo, de la ruta.
CONSULTAS_API_URL=${GATEWAY_URL}/api/consultas/consultas

spring.autoconfigure.exclude=org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
